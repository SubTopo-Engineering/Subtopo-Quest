<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><title>SubTopo-Geo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font:14px system-ui,"Segoe UI",Tahoma,sans-serif;background:#0E2B2F;color:#1d2b27;display:flex;align-items:center;justify-content:center}
#phone{position:relative;width:min(420px,100vw);height:min(860px,100vh);background:#fff;overflow:hidden;border:1px solid #d3d1c7;border-radius:28px}
@media(max-width:440px){#phone{border:0;border-radius:0}}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
button,select,input{font:inherit;color:inherit}svg{display:block;margin:auto}
.fab{position:absolute;width:48px;height:48px;border-radius:12px;background:#fff;border:1px solid #d3d1c7;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}.fab.on{background:#EF9F27;border-color:#EF9F27}
#card{position:absolute;top:10px;inset-inline:10px;background:#fff;border:1px solid #d3d1c7;border-radius:14px;padding:8px 12px;cursor:pointer}
#card .r{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#5f5e5a;white-space:nowrap}#c2,#c4{direction:ltr;unicode-bidi:isolate}#c3{font-size:17px;font-weight:600;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:start}#c4{font-size:12px;color:#5f5e5a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{position:absolute;bottom:150px;background:#ffffffee;border-radius:10px;padding:3px 9px;font-size:12px;color:#5f5e5a;white-space:nowrap}
#rec{position:absolute;bottom:78px;inset-inline-end:10px;height:56px;padding:0 18px;border-radius:28px;background:#FCEBEB;border:1px solid #F09595;color:#A32D2D;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer}#rec i{width:14px;height:14px;border-radius:50%;background:#E24B4A}#rec.on i{animation:b 1s infinite}@keyframes b{50%{opacity:.3}}
#nav{position:absolute;bottom:0;inset-inline:0;height:68px;background:#fff;border-top:1px solid #e5e3da;display:flex}#nav button{flex:1;border:0;background:none;font-size:12px;color:#5f5e5a;cursor:pointer}#nav button.on{color:#185FA5}
#sheet{position:absolute;inset-inline:0;bottom:68px;max-height:68%;overflow:auto;background:#fff;border-top:1px solid #d3d1c7;border-radius:18px 18px 0 0;padding:12px 14px;display:none}
#sheet h3{margin:0 0 8px;font-size:16px}#sheet h4{margin:14px 0 6px;font-size:13px;color:#0F6E56}#sheet pre{margin:0;white-space:pre-wrap;font:12px ui-monospace,Consolas,monospace;direction:ltr;text-align:start}
.b{background:#f1efe8;border:1px solid #d3d1c7;border-radius:10px;padding:8px 12px;min-height:44px;cursor:pointer;margin:0 6px 6px 0}.b.p{background:#EF9F27;border-color:#EF9F27}
.fr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 0}.fr input,.fr select{width:55%;min-height:36px;border:1px solid #d3d1c7;border-radius:8px;padding:0 8px;background:#fff}.row{display:flex;justify-content:space-between;gap:6px;padding:4px 0;border-bottom:1px solid #eee}.row .b{min-height:30px;padding:2px 8px;margin:0}
#gbar{position:absolute;bottom:176px;inset-inline:10px;background:#fff;border:1px solid #EF9F27;border-radius:12px;padding:8px 10px;display:none;align-items:center;gap:10px;font-size:14px}#gtxt b{white-space:nowrap}#toast{pointer-events:none;position:absolute;top:110px;inset-inline:40px;background:#1d2b27;color:#fff;border-radius:10px;padding:8px 12px;text-align:center;display:none}
#spl{position:absolute;inset:0;background:#EEF3F8;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;color:#1d2b27}
#spl svg.w{position:absolute;inset:0;width:100%;height:100%}#spl>*:not(.w){position:relative}#spl h1{font-size:36px;margin:8px 0 0;color:#0B2A6B}#spl p{margin:0;color:#46607f}#spl .c{margin-top:22px;line-height:1.8;color:#46607f}#spl .c b{color:#0B2A6B}
#spl button{border:1px solid #b9c8dc;background:#fff;color:#0B2A6B;border-radius:8px;padding:6px 12px;min-height:40px;cursor:pointer}#go{background:#EF9F27!important;color:#1a1200!important;border-color:#EF9F27!important;min-width:170px;margin-top:20px}

const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI,K0=0.9996;
const WGS={a:6378137,f:1/298.257223563},INTL={a:6378388,f:1/297};for(const E of[WGS,INTL])E.e2=E.f*(2-E.f);
const SHIFT=[-87,-98,-121]; // ED50->WGS84, valeur Europe occidentale : A VALIDER pour la Libye
function coef(n){const n2=n*n,n3=n2*n,n4=n3*n,n5=n4*n,n6=n5*n;
return{al:[n/2-2/3*n2+5/16*n3+41/180*n4-127/288*n5+7891/37800*n6,13/48*n2-3/5*n3+557/1440*n4+281/630*n5-1983433/1935360*n6,61/240*n3-103/140*n4+15061/26880*n5+167603/181440*n6,49561/161280*n4-179/168*n5+6601661/7257600*n6,34729/80640*n5-3418889/1995840*n6,212378941/319334400*n6]}}
const cm=z=>-183+6*z,zoneOf=l=>Math.min(60,Math.floor((l+180)/6)+1);
function tm(lat,lon,E,l0,k0,fe,fn){const n=E.f/(2-E.f),c=coef(n),A=E.a/(1+n)*(1+n*n/4+n**4/64+n**6/256),e=2*Math.sqrt(n)/(1+n);
const p=rad(lat),l=rad(lon-l0),t=Math.sinh(Math.atanh(Math.sin(p))-e*Math.atanh(e*Math.sin(p)));
const x0=Math.atan2(t,Math.cos(l)),h0=Math.asinh(Math.sin(l)/Math.hypot(t,Math.cos(l)));let x=x0,h=h0;
for(let j=1;j<=6;j++){x+=c.al[j-1]*Math.sin(2*j*x0)*Math.cosh(2*j*h0);h+=c.al[j-1]*Math.cos(2*j*x0)*Math.sinh(2*j*h0)}
return{e:fe+k0*A*h,n:fn+k0*A*x}}
function toUtm(lat,lon,zone,E){const z=zone||zoneOf(lon),r=tm(lat,lon,E||WGS,cm(z),K0,5e5,lat>=0?0:1e7);return{zone:z,north:lat>=0,e:r.e,n:r.n}}
function ecef(lat,lon,E){const p=rad(lat),l=rad(lon),N=E.a/Math.sqrt(1-E.e2*Math.sin(p)**2);return[N*Math.cos(p)*Math.cos(l),N*Math.cos(p)*Math.sin(l),N*(1-E.e2)*Math.sin(p)]}
function geo(x,y,z,E){const lon=Math.atan2(y,x),p=Math.hypot(x,y);let lat=Math.atan2(z,p*(1-E.e2));
for(let i=0;i<10;i++){const N=E.a/Math.sqrt(1-E.e2*Math.sin(lat)**2),h=p/Math.cos(lat)-N;lat=Math.atan2(z,p*(1-E.e2*N/(N+h)))}return{lat:deg(lat),lon:deg(lon)}}
function wgsToLocal(lat,lon,sh,E){const[x,y,z]=ecef(lat,lon,WGS);return geo(x-sh[0],y-sh[1],z-sh[2],E)}
function wgsToEd50(lat,lon){return wgsToLocal(lat,lon,SHIFT,INTL)}
function vinc(a,b){if(a.lat===b.lat&&a.lon===b.lon)return 0;const f=WGS.f,bb=WGS.a*(1-f);
const U1=Math.atan((1-f)*Math.tan(rad(a.lat))),U2=Math.atan((1-f)*Math.tan(rad(b.lat))),Lg=rad(b.lon-a.lon);
const sU1=Math.sin(U1),cU1=Math.cos(U1),sU2=Math.sin(U2),cU2=Math.cos(U2);let lam=Lg,ss,cs,sg,c2a,c2m;
for(let i=0;i<100;i++){const sl=Math.sin(lam),cl=Math.cos(lam);ss=Math.hypot(cU2*sl,cU1*sU2-sU1*cU2*cl);cs=sU1*sU2+cU1*cU2*cl;sg=Math.atan2(ss,cs);
const sa=cU1*cU2*sl/ss;c2a=1-sa*sa;c2m=c2a?cs-2*sU1*sU2/c2a:0;const C=f/16*c2a*(4+f*(4-3*c2a)),p=lam;
lam=Lg+(1-C)*f*sa*(sg+C*ss*(c2m+C*cs*(-1+2*c2m*c2m)));if(Math.abs(lam-p)<1e-12)break}
const u2=c2a*(WGS.a**2-bb*bb)/(bb*bb),A=1+u2/16384*(4096+u2*(-768+u2*(320-175*u2))),B=u2/1024*(256+u2*(-128+u2*(74-47*u2)));

function q(phi,E){const es=Math.sqrt(E.e2),s=Math.sin(phi);return(1-E.e2)*(s/(1-E.e2*s*s)-1/(2*es)*Math.log((1-es*s)/(1+es*s)))}
function ellArea(pts){const qp=q(Math.PI/2,WGS),R=WGS.a*Math.sqrt(qp/2);let s=0;
for(let i=0;i<pts.length;i++){const j=(i+1)%pts.length;s+=rad(pts[j].lon-pts[i].lon)*(q(rad(pts[i].lat),WGS)+q(rad(pts[j].lat),WGS))/(2*qp)}return Math.abs(s)*R*R}
function gridArea(pts){const z=zoneOf(pts.reduce((s,p)=>s+p.lon,0)/pts.length),u=pts.map(p=>toUtm(p.lat,p.lon,z));let s=0;
for(let i=0;i<u.length;i++){const j=(i+1)%u.length;s+=u[i].e*u[j].n-u[j].e*u[i].n}return Math.abs(s)/2}
function dms(v,isLat){const h=isLat?(v>=0?'N':'S'):(v>=0?'E':'W');v=Math.abs(v);let d=Math.floor(v),m=Math.floor((v-d)*60),s=+((v-d-m/60)*3600).toFixed(2);if(s>=60){s=0;m++}if(m>=60){m-=60;d++}return d+'°'+String(m).padStart(2,'0')+"'"+s.toFixed(2).padStart(5,'0')+'"'+h}

function coefInv(n){const n2=n*n,n3=n2*n,n4=n3*n,n5=n4*n,n6=n5*n;
return{be:[n/2-2/3*n2+37/96*n3-1/360*n4-81/512*n5+96199/604800*n6,1/48*n2+1/15*n3-437/1440*n4+46/105*n5-1118711/3870720*n6,17/480*n3-37/840*n4-209/4480*n5+5569/90720*n6,4397/161280*n4-11/504*n5-830251/7257600*n6,4583/161280*n5-108847/3991680*n6,20648693/638668800*n6],

function tmInv(e,nn,E,l0,k0,fe,fn){const n=E.f/(2-E.f),c=coefInv(n),A=E.a/(1+n)*(1+n*n/4+n**4/64+n**6/256);

function localToWgs(lat,lon,sh,E){const[x,y,z]=ecef(lat,lon,E);return geo(x+sh[0],y+sh[1],z+sh[2],WGS)}

async function inflate(raw){try{if(window.DecompressionStream)return new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}catch(e){}return inflateRaw(raw)}
async function unzipKml(buf){const u=new Uint8Array(buf),v=new DataView(buf);let e=u.length-22;while(e>=0&&v.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw 'zip';

const numsOf=s=>s.replace(/\s*,\s*/g,',').trim().split(/\s+/).map(x=>x.split(',').map(Number)).filter(a=>a.length>=2&&isFinite(a[0])&&isFinite(a[1]));
function parseKml(tx){const d=new DOMParser().parseFromString(tx,'application/xml');if(d.querySelector('parsererror'))throw 'xml';const R={w:[],l:[],g:[]},co=n=>numsOf(n.textContent).map(a=>({lon:a[0],lat:a[1],alt:a[2]||0}));
d.querySelectorAll('Placemark').forEach(pm=>{const nm=((pm.querySelector('name')||{}).textContent||'').trim();
pm.querySelectorAll('Point coordinates').forEach(n=>{const a=co(n)[0];if(a)R.w.push({...a,n:nm})});

pm.querySelectorAll('Polygon outerBoundaryIs coordinates').forEach(n=>{const a=co(n);if(a.length>1&&a[0].lat===a[a.length-1].lat&&a[0].lon===a[a.length-1].lon)a.pop();a.n=nm;R.g.push(a)});
pm.querySelectorAll('Track').forEach(tr=>{const cs=[...tr.querySelectorAll('coord')].map(c=>c.textContent.trim().split(/\s+/).map(Number)),ws=[...tr.querySelectorAll('when')].map(w=>Date.parse(w.textContent)),
a=cs.filter(c=>c.length>=2&&isFinite(c[0])&&isFinite(c[1])).map((c,i)=>({lon:c[0],lat:c[1],alt:c[2]||0,t:ws[i]||0}));a.n=nm;R.l.push(a)})});return R}
function parseGpx(tx){const d=new DOMParser().parseFromString(tx,'application/xml');if(d.querySelector('parsererror'))throw 'xml';const R={w:[],l:[],g:[]},num=n=>({lat:+n.getAttribute('lat'),lon:+n.getAttribute('lon')});
d.querySelectorAll('wpt').forEach(n=>R.w.push({...num(n),n:(n.querySelector('name')||{}).textContent||'',alt:n.querySelector('ele')?+n.querySelector('ele').textContent:0}));
d.querySelectorAll('trk').forEach(k=>{const nm=((k.querySelector('name')||{}).textContent||'').trim();k.querySelectorAll('trkseg').forEach(s=>{const a=[...s.querySelectorAll('trkpt')].map(n=>{const el=n.querySelector('ele'),tt=n.querySelector('time');return{...num(n),alt:el?+el.textContent:null,t:tt?Date.parse(tt.textContent):0}});a.n=nm;R.l.push(a)})});
d.querySelectorAll('rte').forEach(s=>{const a=[...s.querySelectorAll('rtept')].map(num);a.n=((s.querySelector('name')||{}).textContent||'').trim();R.l.push(a)});return R}
function exportGpx(){const x=['<?xml version="1.0" encoding="UTF-8"?>','<gpx version="1.1" creator="SubTopo-Geo" xmlns="http://www.topografix.com/GPX/1/1">'];
wpts.forEach(p=>x.push(`<wpt lat="${p.lat}" lon="${p.lon}">${p.alt!=null?`<ele>${(+p.alt).toFixed(2)}</ele>`:''}<name>${esc(p.n)}</name></wpt>`));

x.push('</gpx>');dl('subtopo-geo.gpx',x.join('\n'),'application/gpx+xml')}
act.exp=exportGpx;
function merge(R){R.l=R.l.filter(a=>a.length>0);const all=[...R.w,...R.l.flat(),...R.g.flat()];if(!all.length)throw 'geo';if(!all.every(p=>isFinite(p.lat)&&isFinite(p.lon)&&Math.abs(p.lat)<=90&&Math.abs(p.lon)<=180))throw 'crs';
R.w.forEach(p=>wpts.push({n:p.n||t('ptn'),lat:p.lat,lon:p.lon,alt:p.alt}));
R.l.forEach(a=>{seg++;if(a.n)tnames[seg]=a.n;a.forEach(p=>track.push({lat:p.lat,lon:p.lon,alt:p.alt,t:p.t||0,s:seg}))});

function sniff(u){const s=new TextDecoder().decode(u.slice(0,4096));if(/<kml[\s>]/i.test(s))return'kml';if(/<gpx[\s>]/i.test(s))return'gpx';if(/(^|\n)\s*0\s*\r?\n\s*SECTION/.test(s))return'dxf';return'csv'}
$('file').onchange=async e=>{const fl=e.target.files[0];e.target.value='';if(!fl)return;
try{const buf=await fl.arrayBuffer();if(!buf.byteLength)throw 'geo';const u=new Uint8Array(buf),ex=(fl.name.split('.').pop()||'').toLowerCase();let kind=['gpx','kml','kmz','dxf','csv'].includes(ex)?ex:sniff(u);if(u[0]===0x50&&u[1]===0x4b)kind='kmz';

/* --- Sélection --- */
function dseg(x,y,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let u=l?((x-a[0])*dx+(y-a[1])*dy)/l:0;u=Math.max(0,Math.min(1,u));return Math.hypot(x-(a[0]+u*dx),y-(a[1]+u*dy))}
function inPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++)if((P[i][1]>y)!==(P[j][1]>y)&&x<(P[j][0]-P[i][0])*(y-P[i][1])/(P[j][1]-P[i][1])+P[i][0])c=!c;return c}
function hitTest(x,y){const R=26;let best=null,bd=1e9;
wpts.forEach((p,i)=>{const q=scr(p),d=Math.hypot(q[0]-x,q[1]-y);if(d<R&&d<bd){bd=d;best={t:'wp',i}}});if(best)return best;
segs().forEach(a=>{for(let j=1;j<a.length;j++){const d=dseg(x,y,scr(a[j-1]),scr(a[j]));if(d<R*.8&&d<bd){bd=d;best={t:'tr',s:a[0].s}}}});if(best)return best;
polys.forEach((g,i)=>{const P=g.pts.map(scr);let d=1e9;for(let j=0;j<P.length;j++)d=Math.min(d,dseg(x,y,P[j],P[(j+1)%P.length]));if(d<R*.8||inPoly(x,y,P)){if(d<bd){bd=d;best={t:'pg',i}}}});return best}
function selPts(){if(!sl)return[];if(sl.t==='wp')return wpts[sl.i]?[wpts[sl.i]]:[];if(sl.t==='tr')return track.filter(p=>p.s===sl.s);return polys[sl.i]?polys[sl.i].pts:[]}
let delArm=0;
function pick(s,zoom){sl=s;delArm=0;tab='sel';if(zoom){const a=selPts();if(a.length)fit(a)}render();draw()}
function tapAt(x,y){const p=geoAt(x,y);if(mode==='wpt'){addWp(p);mode='pan';labels();return}if(mode==='meas'){meas.push(p);if(tab==='tools')render();draw();return}
const h=hitTest(x,y);if(h)pick(h,false);else if(sl){sl=null;if(tab==='sel')tab='map';render();draw()}}
const durOf=a=>{let s=0;for(let i=1;i<a.length;i++){const d=(a[i].t-a[i-1].t)/1000;if(d>0)s+=d}return s};
const gl=(z,th)=>{let g=0,l=0,r=z[0];for(let i=1;i<z.length;i++){const d=z[i]-r;if(d>=th&&d>0){g+=d;r=z[i]}else if(-d>=th&&d<0){l-=d;r=z[i]}}return[g,l]};
function profile(a){const z=a.map(p=>p.alt);if(z.filter(v=>v!=null&&isFinite(v)).length<2)return'';const c=[0];for(let i=1;i<a.length;i++)c.push(c[i-1]+vinc(a[i-1],a[i]));const tot=c[c.length-1]||1,zs=z.filter(v=>v!=null),mn=Math.min(...zs),mx=Math.max(...zs),pts=a.map((p,i)=>`${(5+c[i]/tot*290).toFixed(1)},${(75-((p.alt!=null?p.alt:mn)-mn)/((mx-mn)||1)*65).toFixed(1)}`).join(' ');
return`<h4>${t('prof')} (${f(mn,1)} → ${f(mx,1)} m)</h4><svg viewBox="0 0 300 80" width="100%" height="80" style="background:#f6f5ef;border-radius:8px"><polyline fill="none" stroke="#D85A30" stroke-width="2" points="${pts}"/></svg>`}
const xyzS=p=>{const r=crs().f(p.lat,p.lon);return`X ${f(r[0],2)}  Y ${f(r[1],2)}  Z ${p.alt!=null?f(p.alt,2):'—'}`};
V_.sel=()=>{if(!sl)return head('sel')+'<p>–</p>';const C=crs(),nmf=v=>fr(t('nm'),`<input id="sn" type="text" value="${esc(v)}">`),
btn=(extra)=>`<p><button class="b p" data-a="selsave">${t('apply')}</button><button class="b" data-a="selzoom">${t('ztr')}</button>${extra||''}<button class="b" data-a="seldel">${t('del')}</button></p>`;
if(sl.t==='wp'){const p=wpts[sl.i];if(!p){sl=null;return V_.sel()}const r=C.f(p.lat,p.lon),fi=(id,l,v)=>fr(l,`<input id="${id}" type="text" inputmode="decimal" value="${v}">`);

if(sl.t==='tr'){const a=track.filter(p=>p.s===sl.s);if(!a.length){sl=null;return V_.sel()}const d=len(a),tt=durOf(a),zs=a.map(p=>p.alt).filter(v=>v!=null&&isFinite(v)),g=zs.length>1?gl(zs,1):[0,0];
return head('sel')+nmf(tn(sl.s))+`<pre>${a.length} pts\n${t('dist')}: ${f(d,2)} m\n${Math.floor(tt/60)} min ${Math.round(tt%60)} s · ${f(tt?d/tt*3.6:0,1)} km/h\n${zs.length?`Z min ${f(Math.min(...zs),2)} · max ${f(Math.max(...zs),2)} m · D+ ${f(g[0],1)} · D− ${f(g[1],1)} m`:'Z —'}\n▶ ${xyzS(a[0])}\n■ ${xyzS(a[a.length-1])}</pre>`+profile(a)+btn()}
const g=polys[sl.i];if(!g){sl=null;return V_.sel()}const per=len(g.pts)+vinc(g.pts[g.pts.length-1],g.pts[0]);
return head('sel')+nmf(g.n)+`<pre>${g.pts.length} ${t('verts').toLowerCase()}\n${t('au')}: ${f(gridArea(g.pts),2)} m²\n${t('ae')}: ${f(ellArea(g.pts),2)} m²\n${t('per')}: ${f(per,2)} m</pre><h4>${t('verts')}</h4><pre>${g.pts.slice(0,200).map((p,i)=>`${i+1}: ${xyzS(p)}`).join('\n')}</pre>`+btn()};
act.selsave=()=>{if(!sl)return;const nm=($('sn')||{value:''}).value.trim();

const P=new Map();let drag2=null,pinch=null;
